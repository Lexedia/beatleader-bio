<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeatLeader Bio Dev Preview</title>
  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0d13;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      transition: background 0.3s ease;
    }

    .preview-bar {
      margin-bottom: 24px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      font-size: 13px;
    }

    .preview-bar label {
      font-weight: 700;
      color: #ffb7d5;
    }

    .theme-select {
      background: #1e1828;
      color: #fff;
      border: 1px solid #ff85a2;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }

    .preview-container {
      width: 100%;
      max-width: 900px;
      padding: 20px;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    /* Simulating BeatLeader Themes */
    body.theme-mirror {
      background: linear-gradient(135deg, #2b1055, #7597de);
      background-attachment: fixed;
    }

    body.theme-flylight {
      background: #fdf2f4;
      color: #333;
    }

    body.theme-flylight .preview-bar {
      background: #ffffff;
      border-color: #ffd1dc;
      color: #333;
      box-shadow: 0 4px 20px rgba(235, 131, 163, 0.15);
    }

    body.theme-flylight .theme-select {
      background: #ffffff;
      color: #333;
    }
  </style>
</head>

<body class="reedark-theme">
  <div class="preview-bar">
    <label>🌸 BeatLeader Theme Simulator:</label>
    <select class="theme-select" id="themeSelect">
      <option value="reedark-theme">Dark Mode</option>
      <option value="flylight-theme">Flylight</option>
    </select>
  </div>

  <div class="preview-container" id="root"></div>

  <script type="module" src="/src/index.tsx"></script>
  <script>
    const themeSelect = document.getElementById('themeSelect');
    themeSelect.addEventListener('change', (e) => {
      document.body.className = e.target.value;
      if (e.target.value === 'mirror-theme' || e.target.value === 'unbounded-theme') {
        document.body.classList.add('theme-mirror');
      } else if (e.target.value === 'flylight-theme') {
        document.body.classList.add('theme-flylight');
      }
    });
  </script>
</body>

</html>
